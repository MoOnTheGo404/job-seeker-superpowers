name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`, deliberately.
      #
      # npm ci rejects this lockfile over a transitive eslint dependency
      # (ajv@6) that npm itself never writes into the lock — reproducible with
      # a lockfile regenerated from scratch, and with one built via
      # --package-lock-only. It is an npm resolution inconsistency rather than
      # anything wrong here, and npm install resolves the same tree without it.
      #
      # Worth revisiting on a future npm release; npm ci is the stricter choice
      # when it works.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build is the only step that exercises the TanStack Start and nitro
      # pipeline, so it catches config breakage the other three miss. Supabase
      # vars are placeholders — nothing here talks to a real project, and the
      # client reads them at runtime rather than baking them in.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
